[package]
name = "vidr"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Video: codecs, hardware decode and encode, colour, filters, and models on the GPU"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/vidr"
readme = "../../README.md"
keywords = ["video", "codec", "gpu", "nvenc", "vulkan"]
categories = ["multimedia::video", "multimedia::encoding"]

[features]
default = []
# Bitstream filters and config records for each codec. No dependencies.
h264 = []
hevc = []
av1 = []
# Backend-neutral decode API: the `Decoder` trait and `DecodedFrame`, over
# numr tensors. Builds on any numr backend.
decode = ["dep:numr"]
# NVDEC hardware decode on numr's CUDA context and stream. Loads
# `libnvcuvid.so.1` at run time, so the build links no NVIDIA library. numr's
# CUDA backend needs nvcc at build time.
nvdec = [
  "decode",
  "h264",
  "hevc",
  "av1",
  "numr/cuda",
  "dep:cudarc",
  "dep:libloading",
]
# Backend-neutral encode API: the `Encoder` trait, `EncodeConfig`,
# `EncodeFrame` and `EncodedPacket`, over numr tensors. Shares the pixel format
# and colour types of `decode`.
encode = ["decode"]
# NVENC hardware encode on numr's CUDA context and stream. Loads
# `libnvidia-encode.so.1` at run time, so the build links no NVIDIA library.
# numr's CUDA backend needs nvcc at build time.
nvenc = [
  "encode",
  "h264",
  "hevc",
  "av1",
  "numr/cuda",
  "dep:cudarc",
  "dep:libloading",
]
# Every CUDA path.
cuda = ["nvdec", "nvenc"]

[dependencies]
numr = { version = "0.15", optional = true }
# Driver API only, the same version and features numr enables, so one copy
# links. vidr calls `cuMemcpy2DAsync` and stream events on numr's stream, and
# `cuMemAlloc` for NVENC input surfaces.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
  "std",
  "driver",
  "fallback-dynamic-loading",
  "cuda-version-from-build-system",
] }
libloading = { version = "0.9", optional = true }
