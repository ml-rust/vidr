[package]
name = "vidr"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Video: codecs, hardware decode and encode, colour, filters, and models on the GPU"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/vidr"
readme = "../../README.md"
keywords = ["video", "codec", "gpu", "nvenc", "vulkan"]
categories = ["multimedia::video", "multimedia::encoding"]

[features]
default = []
# Bitstream filters and config records for each codec. No dependencies.
h264 = []
hevc = []
av1 = []
# VP9 uncompressed-header colour: `color_space` and `color_range`. Crate-internal
# parsers read the whole header.
vp9 = []
# Backend-neutral decode API: the `Decoder` trait and `DecodedFrame`, over
# numr tensors. Builds on any numr backend.
decode = ["dep:numr"]
# NVDEC hardware decode on numr's CUDA context and stream. Loads
# `libnvcuvid.so.1` at run time, so the build links no NVIDIA library. numr's
# CUDA backend needs nvcc at build time.
nvdec = [
  "decode",
  "h264",
  "hevc",
  "av1",
  "vp9",
  "numr/cuda",
  "dep:cudarc",
  "dep:libloading",
]
# Backend-neutral encode API: the `Encoder` trait, `EncodeConfig`,
# `EncodeFrame` and `EncodedPacket`, over numr tensors. Shares the pixel format
# and colour types of `decode`.
encode = ["decode"]
# NVENC hardware encode on numr's CUDA context and stream. Loads
# `libnvidia-encode.so.1` at run time, so the build links no NVIDIA library.
# numr's CUDA backend needs nvcc at build time.
nvenc = [
  "encode",
  "h264",
  "hevc",
  "av1",
  "numr/cuda",
  "dep:cudarc",
  "dep:libloading",
]
# Conversion between NV12 or P010 planes and float RGB, on any numr backend with
# colour kernels. `numr/f16` gives the CPU backend F16 RGB.
frame = ["decode", "encode", "numr/f16"]
# MP4 and QuickTime MOV input and MP4 output through containr, the decoder's
# codec names included. Needs no GPU.
mp4 = ["decode", "encode", "dep:containr", "containr/mp4"]
# Matroska and WebM input and Matroska output through containr, the decoder's
# codec names included. Needs no GPU.
mkv = ["decode", "encode", "dep:containr", "containr/mkv"]
# The threaded decode, transform, and encode pump over the `Decoder` and
# `Encoder` traits. Needs no GPU.
pipeline = ["decode", "encode", "frame"]
# numr's WebGPU backend, for code and tests that name `WgpuRuntime`. vidr's own
# code runs on it through the `Runtime` trait, so this enables nothing in vidr.
wgpu = ["numr/wgpu"]
# Every CUDA path.
cuda = ["nvdec", "nvenc"]
# AV1 software decode on libdav1d. Links libdav1d 1.3.0 or newer, found through
# pkg-config. Each frame takes one copy through host memory.
dav1d = ["frame", "av1", "dep:dav1d"]
# H.264 software decode and encode on OpenH264 compiled from source, for
# developers and CI. A source build gets no Cisco patent cover. Each frame takes
# one copy through host memory.
openh264 = ["frame", "h264", "dep:openh264", "openh264/source"]
# H.264 software decode and encode on Cisco's OpenH264 binary, loaded from a path
# the caller supplies after the crate checks its hash. For shipped builds. Cisco's
# patent cover applies only to its own binary. No download code exists here.
openh264-cisco = ["frame", "h264", "dep:openh264", "openh264/libloading"]
# AV1 software encode on rav1r, pure Rust, at 8 or 10 bits. Each frame takes one
# copy through host memory. AV1 patent terms bind a binary distribution: see the
# README. Assembly stays off in this feature.
cpu-av1 = ["frame", "av1", "dep:rav1r"]
# rav1r's assembly. NASM 2.15 or newer on x86_64, a C compiler on aarch64.
cpu-av1-asm = ["cpu-av1", "rav1r/asm"]
# VP9 software decode on rusty_vp9, pure Rust, profiles 0 and 2, 4:2:0. Each frame
# takes one copy through host memory. VP9 has a patent pool: see the README.
cpu-vp9 = ["frame", "vp9", "dep:rusty_vp9"]
# HEVC software decode written in this crate, pure Rust, Main and Main 10 at
# 4:2:0. Each frame takes one copy through host memory. HEVC has patent pools: see
# the README. The kernels select AVX2 or NEON at run time through fearless_simd.
cpu-hevc = ["frame", "hevc", "dep:fearless_simd"]

[dependencies]
numr = { version = "0.15", optional = true }
containr = { version = "0.1", optional = true }
# Driver API only, the same version and features numr enables, so one copy
# links. vidr calls `cuMemcpy2DAsync` and stream events on numr's stream, and
# `cuMemAlloc` for NVENC input surfaces.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
  "std",
  "driver",
  "fallback-dynamic-loading",
  "cuda-version-from-build-system",
] }
libloading = { version = "0.9", optional = true }
dav1d = { version = "0.11", optional = true }
openh264 = { version = "0.9", optional = true, default-features = false }
rav1r = { version = "0.1", optional = true, default-features = false, features = [
  "threading",
] }
# Pinned: conformance runs against this exact release.
rusty_vp9 = { version = "=0.1.3", optional = true, default-features = false }
# The vector types and CPU feature tokens of the HEVC kernels. The fallback feature gives
# the scalar token on every target, for CPUs with neither AVX2 nor NEON and for the tests.
fearless_simd = { version = "1.2", optional = true, features = [
  "force_support_fallback",
] }

[[example]]
name = "hevc_decode"
required-features = ["cpu-hevc"]
