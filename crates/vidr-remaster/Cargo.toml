[package]
name = "vidr-remaster"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Remaster video on the GPU: AI restoration, upscaling, scaling, and encoding in one pass"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/vidr"
readme = "../../README.md"
keywords = ["video", "upscaling", "super-resolution", "restoration"]
categories = ["multimedia::video", "command-line-utilities"]

[features]
default = []
# Input and output containers, and the codecs of a whole run.
mp4 = ["vidr/mp4"]
mkv = ["vidr/mkv"]
h264 = ["vidr/h264"]
hevc = ["vidr/hevc"]
# `RemasterTransform` with no model: the `--from-upscaled` resize. Needs no GPU.
transform = ["dep:numr", "vidr/pipeline"]
# `realesr-general-x4v3`, the `fast` model.
model-srvgg = ["transform", "dep:boostr", "boostr/super-resolution"]
# `RealESRGAN_x2plus` and `2x_PureVision`.
model-rrdb = ["transform", "dep:boostr", "boostr/super-resolution"]
# Half-precision paths of numr and boostr.
f16 = ["numr?/f16", "boostr?/f16"]
# Every CUDA path: the runtime, NVDEC, and NVENC. numr's CUDA backend needs nvcc at
# build time.
cuda = ["transform", "vidr/cuda", "boostr/cuda", "numr/cuda"]
# numr's WebGPU runtime, with CPU codecs. No hardware codec exists on it yet.
wgpu = ["transform", "vidr/wgpu", "numr/wgpu", "boostr?/wgpu"]
# AV1 decode on libdav1d, through pkg-config. One host copy per frame.
dav1d = ["transform", "vidr/dav1d"]
# VP9 decode on rusty_vp9, pure Rust. One host copy per frame. See the README on
# VP9's patent pool.
cpu-vp9 = ["transform", "vidr/cpu-vp9"]
# HEVC decode in vidr, pure Rust. One host copy per frame. See the README on HEVC's
# patent pools.
cpu-hevc = ["transform", "vidr/cpu-hevc"]
# H.264 Baseline decode and encode on OpenH264 compiled from source, with no Cisco
# patent cover. One host copy per frame.
openh264 = ["transform", "vidr/openh264"]
# The same on Cisco's binary, from `--openh264-library`. One host copy per frame.
openh264-cisco = ["transform", "vidr/openh264-cisco"]
# AV1 encode on rav1r, a fork of rav1e, pure Rust, 8 or 10 bits. One host copy per
# frame. BSD-2-Clause and the AOM Patent License 1.0: see `notices/`.
cpu-av1 = ["transform", "vidr/cpu-av1"]
# rav1r's assembly. NASM 2.15 or newer on x86_64, a C compiler on aarch64.
cpu-av1-asm = ["cpu-av1", "vidr/cpu-av1-asm"]

[[bin]]
name = "vidr-remaster"
path = "src/bin/vidr-remaster.rs"

[dependencies]
vidr = { path = "../vidr", version = "0.1.0" }
# Tensors and kernels of the frame transform.
numr = { version = "0.15", optional = true }
# The restoration networks.
boostr = { version = "0.11", optional = true }
# Reads and writes the provenance sidecar (JSON schema 1) and writes the run
# report. `preserve_order` keeps the report's keys in the order a run sets them.
serde_json = { version = "1", features = ["preserve_order"] }
# Parses the command line.
clap = { version = "4", features = ["derive"] }
# Turns Ctrl-C, SIGTERM, and SIGHUP into a stop request.
ctrlc = { version = "3", features = ["termination"] }
# Hashes source and enhanced files for the provenance record.
sha2 = "0.11"
# Writes the sidecar atomically: temporary file in the same directory, then
# rename. Holds a run's temporary output directory beside the output.
tempfile = "3"
