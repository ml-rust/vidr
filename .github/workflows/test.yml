# Reusable test workflow.
#
# Called by:
#   - ci.yml              (PR checks + manual dispatch)
#   - release-prepare.yml (tag gate, before anything is published)
#
# Not triggered directly — `workflow_call` only.
#
# Every third-party action is pinned to a commit SHA, with its release in a
# trailing comment. A tag can move. A SHA cannot, so a retagged action cannot
# enter a run that holds a crates.io token. Dependabot keeps the pins current
# (.github/dependabot.yml).
#
# Jobs:
#   lint     — rustfmt, docs, shellcheck
#   clippy   — `-D warnings` on every feature set in scripts/ci/clippy.sh, per crate
#   test     — the test suites with every non-CUDA feature
#   msrv     — the MSRV from crates/vidr/Cargo.toml
#   audit    — cargo-deny: advisories, licences, sources, banned crates
#
# No job installs a CUDA toolkit, a GPU driver, or a hardware video stack.
# Hardware features (`cuda`, `nvdec`, `nvenc`, `vulkan-video`) stay out
# of every feature set, so every hardware path sits behind its gate and the rest
# compiles without it. `nvdec` loads libnvcuvid and `nvenc` loads
# libnvidia-encode at run time, but both enable numr's `cuda` feature, whose
# build script needs nvcc. `wgpu` is vendor-neutral and needs no SDK to build, so
# it has clippy sets. Its tests need an adapter, so the test job leaves it out.
#
# CPU codecs run in CI. `dav1d` links libdav1d through pkg-config, so a job with
# that feature installs libdav1d-dev. `openh264` compiles OpenH264 with the
# runner's C++ compiler. Its assembly needs nasm and falls back to C without it.
# `openh264-cisco` loads a binary at run time, and its tests skip with no binary.
# `cpu-vp9` and `cpu-hevc` are pure Rust. `cpu-av1` is pure Rust, and
# `cpu-av1-asm` needs nasm. The `vidr-remaster` test sets with CPU codecs run whole
# videos with no GPU, in `tests/e2e_cpu`, so that test job installs ffmpeg.
#
# No job runs with `--locked`. Cargo's MSRV-aware resolver picks the versions.

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Format, Docs & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      # Warnings are denied: a link to a private item renders as plain text
      # rather than an error, so the published docs lose it with no report.
      - name: Build docs (vidr)
        run: cargo doc -p vidr --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build docs (vidr-remaster)
        run: cargo doc -p vidr-remaster --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Shellcheck release scripts
        run: shellcheck scripts/ci/*.sh scripts/conformance/*.sh

  # ─────────────────────────────────────────────────────────────────────────
  # One job per crate. `scripts/ci/clippy.sh` lists the feature sets and runs
  # them all on one build cache. A failed set is named in the annotations.
  clippy:
    name: Clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [vidr, vidr-remaster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: clippy-${{ matrix.crate }}

      - name: Install libdav1d and nasm
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev nasm

      - name: Clippy
        env:
          CRATE: ${{ matrix.crate }}
        run: bash scripts/ci/clippy.sh "$CRATE"

  # ─────────────────────────────────────────────────────────────────────────
  # Tests that need a GPU, a model directory or a media fixture skip with a
  # notice when their env var is unset. None is set here.
  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: vidr, features: "h264,hevc,av1,vp9,frame,mp4,mkv,pipeline,cpu-hevc" }
          - { crate: vidr, features: "dav1d,openh264,openh264-cisco" }
          - { crate: vidr, features: "cpu-av1,cpu-vp9,dav1d,mkv" }
          - { crate: vidr, features: "cpu-vp9,pipeline" }
          - { crate: vidr-remaster, features: "" }
          - { crate: vidr-remaster, features: "mp4,mkv,h264,hevc,model-srvgg,model-rrdb,f16" }
          - { crate: vidr-remaster, features: "mp4,mkv,dav1d,cpu-vp9,cpu-hevc,openh264,cpu-av1,model-srvgg,model-rrdb,f16" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: test-${{ matrix.crate }}

      - name: Install libdav1d
        if: contains(matrix.features, 'dav1d')
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev

      - name: Install ffmpeg
        if: matrix.crate == 'vidr-remaster' && contains(matrix.features, 'cpu-')
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        env:
          CRATE: ${{ matrix.crate }}
          FEATURES: ${{ matrix.features }}
        run: cargo test -p "$CRATE" --features "$FEATURES" --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # The MSRV comes from `package.rust-version`, so the published contract and
  # this job cannot drift apart. Both crates declare the same one. It is read
  # with grep: the toolchain `cargo metadata` would run on is the one this job
  # is choosing.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from the manifests
        id: msrv
        run: |
          set -euo pipefail
          VIDR=$(grep -m1 '^rust-version = ' crates/vidr/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          REMASTER=$(grep -m1 '^rust-version = ' crates/vidr-remaster/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$VIDR" || "$VIDR" != "$REMASTER" ]]; then
            echo "::error::rust-version is missing or differs: vidr '$VIDR', vidr-remaster '$REMASTER'"
            exit 1
          fi
          echo "Declared MSRV: $VIDR"
          echo "version=$VIDR" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: msrv-${{ steps.msrv.outputs.version }}

      # Library targets only. Dev-dependencies are not part of the contract.
      - name: Check MSRV (vidr)
        run: cargo check -p vidr --lib

      - name: Check MSRV (vidr-remaster)
        run: cargo check -p vidr-remaster --lib

  # ─────────────────────────────────────────────────────────────────────────
  # `--exclude-dev`: dev-dependencies link test oracles only.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --exclude-dev check
